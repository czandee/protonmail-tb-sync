version: '3'

vars:
  DIST_DIR: dist

tasks:
  default:
    desc: Lists all available automation commands
    cmds:
      - task --list

  install:
    desc: Installs development dependencies
    sources:
      - package.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm install

  clean:
    desc: Removes build artifacts
    cmds:
      - rm -rf {{.DIST_DIR}}

  sync-version:
    desc: Copies the version from package.json into manifest.json (single source of truth)
    deps: [install]
    sources:
      - package.json
    cmds:
      - node -e "
          const fs = require('fs');
          const version = require('./package.json').version;
          const manifest = JSON.parse(fs.readFileSync('src/manifest.json', 'utf8'));
          if (manifest.version !== version) {
            manifest.version = version;
            fs.writeFileSync('src/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
            console.log('[sync-version] manifest.json updated to ' + version);
          }
        "

  lint:
    desc: Validates the extension manifest and source files via web-ext
    deps: [sync-version]
    cmds:
      # web-ext lints against the Firefox API surface, not Thunderbird's.
      # The 16 warnings it produces (MANIFEST_PERMISSIONS, UNSUPPORTED_API,
      # MISSING_DATA_COLLECTION_PERMISSIONS) are all false positives: the
      # permissions and APIs are valid Thunderbird MailExtension features
      # that Firefox simply does not implement. They can be safely ignored.
      - npm run lint

  build:
    desc: Packages the extension into an installable .xpi via web-ext
    deps: [lint]
    sources:
      - src/**/*
    generates:
      - '{{.DIST_DIR}}/*.xpi'
    cmds:
      - npm run build
      - for f in {{.DIST_DIR}}/*.zip; do mv "$f" "${f%.zip}.xpi"; done

  audit:
    desc: Applies safe (non-breaking) security fixes to npm dependencies
    deps: [install]
    cmds:
      - npm audit fix

  dev:
    desc: Launches Thunderbird with the extension loaded in a temporary profile
    deps: [install]
    cmds:
      - npm start
